<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JavaScript To-Do List">
    <title>To-Do List | Niraj Wali</title>
    <link rel="stylesheet" href="todo.css">
</head>

<body>

<header>
    <h1>My To-Do List</h1>
</header>

<main>

    <section aria-labelledby="todo-title">

        <h2 id="todo-title">Task Manager</h2>

        <form id="todoForm">
            <label for="taskInput">Add a task</label>

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
                required
            >

            <button type="submit">Add Task</button>
        </form>

        <div>
            <button type="button" data-filter="all">All</button>
            <button type="button" data-filter="active">Active</button>
            <button type="button" data-filter="completed">Completed</button>
        </div>

        <ul id="taskList"></ul>

    </section>

</main>

<script src="todo.js"></script>

</body>
</html>
